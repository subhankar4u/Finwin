<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>FinWin</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f3f5f4;--card:#fff;--ink:#14231f;--mut:#5d6b66;--line:#d9dfdc;--acc:#0b5d4b;--acc2:#e7f1ee;--warn:#a55a00;--bad:#a3261f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1715;--card:#17211e;--ink:#e6efec;--mut:#93a39d;--line:#2a3833;--acc:#5fc4a8;--acc2:#1c2e29;--warn:#e0a24d;--bad:#f0837b}}
:root[data-theme=dark]{--bg:#0f1715;--card:#17211e;--ink:#e6efec;--mut:#93a39d;--line:#2a3833;--acc:#5fc4a8;--acc2:#1c2e29;--warn:#e0a24d;--bad:#f0837b}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Public Sans",system-ui,sans-serif;font-variant-numeric:tabular-nums}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--card)}
.logo{font-weight:800;font-size:20px;letter-spacing:-.02em;margin-right:auto}.logo i{font-style:normal;color:var(--acc)}
select,input,button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:6px 10px}
button{cursor:pointer}button.p{background:var(--acc);color:var(--bg);border-color:var(--acc);font-weight:600}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.lay{display:flex}nav{width:190px;padding:16px 10px;border-right:1px solid var(--line);min-height:calc(100vh - 60px)}
nav button{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 12px;border-radius:6px;color:var(--mut)}nav button.on{background:var(--acc2);color:var(--acc);font-weight:700}
main{flex:1;padding:20px;max-width:1100px;min-width:0}h2{margin:0 0 14px;font-size:22px;letter-spacing:-.01em}h3{margin:0 0 6px;font-size:15px}
.g{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));margin-bottom:14px}
.c{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px;min-width:0}.big{font-size:32px;font-weight:800;letter-spacing:-.03em}.m{color:var(--mut);font-size:13px}.up{color:var(--acc)}.dn{color:var(--bad)}
.q{border:1px solid var(--line);border-radius:50%;width:20px;height:20px;padding:0;font-size:12px;color:var(--mut);margin-left:6px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}th:first-child,td:first-child{text-align:left}th{color:var(--mut);font-weight:600}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.tabs button.on{background:var(--acc2);border-color:var(--acc);color:var(--acc);font-weight:700}
.tag{font-size:12px;border:1px solid var(--line);border-radius:4px;padding:1px 6px;color:var(--mut)}.est{color:var(--warn);border-color:var(--warn)}
.bar{height:10px;background:var(--acc2);border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
.af{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}.af label{font-size:13px;color:var(--mut);display:block}.af input{width:100%}
.note{background:var(--acc2);border-left:3px solid var(--acc);padding:8px 12px;border-radius:4px;font-size:13px}.warn{border-left-color:var(--warn)}
dialog{max-width:640px;width:92%;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px}dialog::backdrop{background:#0008}
#toast{position:fixed;bottom:calc(70px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:6px;display:none}
@media(max-width:760px){.lay{display:block}nav{position:fixed;bottom:0;left:0;right:0;width:auto;min-height:0;display:flex;padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px));background:var(--card);border:0;border-top:1px solid var(--line);z-index:5}nav button{text-align:center;padding:8px 2px;font-size:12px}main{padding:14px 14px 80px}.big{font-size:26px}}
</style></head><body>
<header><div class="logo">Fin<i>Win</i></div>
<select id="prof" aria-label="Profile"><option value="H">Household</option><option>Subh</option><option>Wife</option></select>
<label class="m"><input type="checkbox" id="demo" checked> Demo data</label>
<button id="th" aria-label="Toggle theme">Theme</button></header>
<div class="lay"><nav id="nav"></nav><main id="main"></main></div>
<dialog id="dlg"></dialog><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),fmt=n=>{n=Math.round(n);return(n<0?'-':'')+'₹'+Math.abs(n).toLocaleString('en-IN')},pc=n=>n.toFixed(1)+'%';
const CL=['Bank','Mutual Funds','Equity','NPS','PF','FD','Gold'];
const RET={Bank:3,'Mutual Funds':11,Equity:11,NPS:9,PF:8,FD:6.75,Gold:8},TAX={Bank:1,'Mutual Funds':1.5,Equity:1.5,NPS:1,PF:0,FD:2,Gold:1.5};
let H=[
['Bank','HDFC Savings','Subh',420000,420000],['Bank','SBI Savings','Wife',310000,310000],['Bank','Joint Account','Joint',150000,150000],
['Mutual Funds','Nifty 50 Index Fund','Subh',1850000,1400000],['Mutual Funds','Flexi Cap Fund','Wife',1240000,980000],['Mutual Funds','ELSS Fund','Subh',560000,420000],
['Equity','Infosys (180 sh)','Subh',270000,210000],['Equity','HDFC Bank (250 sh)','Wife',410000,360000],['Equity','ITC (600 sh)','Subh',260000,240000],
['NPS','NPS Tier 1','Subh',980000,780000],['NPS','NPS Tier 1','Wife',540000,460000],
['PF','EPF','Subh',2150000,1700000],['PF','EPF','Wife',1120000,900000],['PF','PPF','Joint',860000,700000],
['FD','SBI FD 7.0%, Mar 2027','Subh',600000,550000],['FD','HDFC FD 6.9%, Nov 2026','Wife',400000,370000],
['Gold','Gold coins, 120 g','Joint',1080000,720000],['Gold','SGB 2028','Subh',310000,220000]].map((r,i)=>({id:i,c:r[0],n:r[1],o:r[2],v:r[3],inv:r[4]}));
let L=[{n:'Home loan',l:'HDFC',o:'Joint',orig:4500000,bal:3120000,r:8.6,emi:41200,due:'05 Oct 2026'},{n:'Car loan',l:'ICICI',o:'Subh',orig:900000,bal:410000,r:9.2,emi:19500,due:'10 Oct 2026'},{n:'Personal loan',l:'Axis',o:'Wife',orig:400000,bal:150000,r:11.5,emi:9800,due:'15 Oct 2026'},{n:'Credit card',l:'HDFC Regalia',o:'Subh',orig:0,bal:38000,r:0,emi:0,due:'20 Oct 2026'}];L.forEach((l,i)=>l.id=i);
const HIST=['Apr','May','Jun','Jul','Aug','Sep'],HF=[.925,.94,.955,.968,.984,1];
const A={ageS:38,ageW:35,ret:50,life:90,exp:120000,inf:6,hinf:10,swr:3.5,ratio:80,sip:60000,part:40000,income:280000,rem:30};
const S={tab:'dash',fire:'Regular',ht:'Bank',pre:5000,backup:12};
const KEY='finwin_v1';
function save(){try{localStorage.setItem(KEY,JSON.stringify({H,L,A,RET,TAX,b:S.backup}))}catch(e){}}
function ap(d){if(d.H)H=d.H;if(d.L)L=d.L;if(d.A)Object.assign(A,d.A);if(d.RET)Object.assign(RET,d.RET);if(d.TAX)Object.assign(TAX,d.TAX)}
try{const d=JSON.parse(localStorage.getItem(KEY));if(d){ap(d);if(d.b!=null)S.backup=d.b}}catch(e){}
const nid=a=>Math.max(-1,...a.map(x=>x.id))+1;
function E(t,id,k,v,n){const o=(t==='H'?H:L).find(x=>x.id==id);o[k]=n?+v:v;o.mine=1;save();go()}
function D(t,id){if(!confirm('Delete this entry?'))return;if(t==='H')H=H.filter(x=>x.id!=id);else L=L.filter(x=>x.id!=id);save();go()}
function AH(){H.push({id:nid(H),c:S.ht,n:'New holding',o:'Subh',v:0,inv:0,mine:1});save();go()}
function AL(){L.push({id:nid(L),n:'Personal loan',l:'Lender',o:'Subh',orig:0,bal:0,r:0,emi:0,due:'01 Nov 2026',mine:1});save();go()}
const OS=(t,id,v)=>`<select onchange="E('${t}',${id},'o',this.value)">${['Subh','Wife','Joint'].map(x=>`<option ${x===v?'selected':''}>${x}</option>`).join('')}</select>`;
const IN=(t,id,k,v,n,w)=>`<input ${n?'type="number"':''} value="${String(v).replace(/"/g,'&quot;')}" onchange="E('${t}',${id},'${k}',this.value,${n?1:0})" style="width:${w||110}px">`;
function imp(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.H)||!Array.isArray(d.L))throw 0;if(confirm(`Import replaces your data with ${d.H.length} holdings and ${d.L.length} loans (you have ${H.length} and ${L.length}). Continue?`)){ap(d);H.forEach(x=>x.mine=1);L.forEach(x=>x.mine=1);save();toast('Imported');go()}}catch(e){toast('Not a valid FinWin backup file')}};r.readAsText(f)}
const T=[['dash','Dashboard'],['hold','Holdings'],['liab','Liabilities'],['fire','FIRE'],['bak','Backup']];
const own=o=>{const p=$('#prof').value;return p==='H'||o===p};
const hs=()=>H.filter(h=>own(h.o)&&($('#demo').checked||h.mine));
const ls=()=>L.filter(h=>own(h.o)&&($('#demo').checked||h.mine));
const sum=(a,f)=>a.reduce((s,x)=>s+f(x),0);
const nper=(b,r,e)=>{r=r/1200;if(!e||b<=0)return 0;if(!r)return b/e;const x=1-b*r/e;return x<=0?Infinity:-Math.log(x)/Math.log(1+r)};
const asset=()=>sum(hs(),h=>h.v),liab=()=>sum(ls(),l=>l.bal);
const blend=()=>{const t=asset();return t?sum(hs(),h=>h.v*(RET[h.c]-TAX[h.c]))/t:0};
function target(v,t){const ratio={Lean:60,Regular:80,Fat:120,Coast:80,Barista:80}[v]??A.ratio;let e=A.exp*12*ratio/100;if(v==='Barista')e=Math.max(0,e-A.part*12);return e*Math.pow(1+A.inf/100,t)/(A.swr/100)}
function years(v){let c=sum(hs(),h=>h.v)-0,r=blend()/100;const inv=sum(hs().filter(h=>h.c!=='Bank'||1),h=>h.v);c=inv;for(let t=0;t<=60;t++){if(c>=target(v,t))return t;c=c*(1+r)+A.sip*12}return null}
function ex(t){$('#dlg').innerHTML=`<h3>How is this calculated?</h3><p>${t}</p><p class="m">Change inputs on the FIRE screen. Every rate is an Estimate you can edit.</p><button onclick="$('#dlg').close()">Close</button>`;$('#dlg').showModal()}
const Q=t=>`<button class="q" aria-label="How is this calculated?" onclick='ex(${JSON.stringify(t)})'>?</button>`;
const toast=t=>{const e=$('#toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2200)};
const empty=()=>`<div class="c"><h3>No entries yet</h3><p class="m">Turn on demo data, or add your first entry in Holdings.</p></div>`;
function line(){const nw=asset()-liab(),p=HF.map(f=>nw*f),mn=Math.min(...p)*.97,mx=Math.max(...p),X=i=>20+i*(360/5),Y=v=>110-(v-mn)/(mx-mn||1)*90;
return`<svg viewBox="0 0 400 140" width="100%" role="img" aria-label="Net worth, last 6 months"><polyline fill="none" stroke="var(--acc)" stroke-width="2.5" points="${p.map((v,i)=>X(i)+','+Y(v)).join(' ')}"/>${p.map((v,i)=>`<circle cx="${X(i)}" cy="${Y(v)}" r="3" fill="var(--acc)"/><text x="${X(i)}" y="132" font-size="10" text-anchor="middle" fill="var(--mut)">${HIST[i]}</text>`).join('')}</svg>`}
const COL=['#0b5d4b','#3f8f7a','#8bbfae','#c9a227','#6b7f99','#a3261f','#e0a24d'];
function alloc(){const t=asset(),d=CL.map(c=>sum(hs().filter(h=>h.c===c),h=>h.v));let o=0;return`<div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap"><svg viewBox="0 0 42 42" width="130" role="img" aria-label="Allocation">${d.map((v,i)=>{const s=`<circle cx="21" cy="21" r="15.9" fill="none" stroke="${COL[i]}" stroke-width="7" stroke-dasharray="${v/t*100} ${100-v/t*100}" stroke-dashoffset="${25-o}"/>`;o+=v/t*100;return s}).join('')}</svg><div class="m">${CL.map((c,i)=>`<div><span style="color:${COL[i]}">■</span> ${c} ${pc(d[i]/t*100)}</div>`).join('')}</div></div>`}
function dash(){if(!hs().length)return'<h2>Dashboard</h2>'+empty();const a=asset(),l=liab(),nw=a-l,prev=nw*HF[4],ch=nw-prev,v=S.fire,y=years(v),tg=target(v,0),inv=sum(hs(),h=>h.v),liq=sum(hs().filter(h=>h.c==='Bank'||h.c==='FD'),h=>h.v);
return`<h2>Dashboard <span class="tag">${$('#prof').value==='H'?'Household':$('#prof').value}</span></h2>
<div class="note" style="margin-bottom:14px">Last updated 30 Sep 2026. <button class="p" onclick="qu()">Start monthly update</button> <span class="tag ${S.backup>A.rem?'est':''}">Last backed up ${S.backup} days ago</span></div>
<div class="g"><div class="c"><div class="m">Net worth ${Q('Net worth = total assets (sum of month-end values you typed) minus total liabilities (outstanding balances).')}</div><div class="big">${fmt(nw)}</div><div class="up">+${fmt(ch)} (${pc(ch/prev*100)}) vs Aug 2026</div>${line()}</div>
<div class="c"><h3>Allocation</h3>${alloc()}</div></div>
<div class="g"><div class="c"><h3>Assets vs liabilities</h3><div>Assets ${fmt(a)}</div><div>Liabilities ${fmt(l)}</div><div>Debt-to-asset ratio <b>${pc(l/a*100)}</b> ${Q('Debt-to-asset = total liabilities ÷ total assets = '+fmt(l)+' ÷ '+fmt(a))}</div></div>
<div class="c"><h3>FIRE progress: ${v} ${Q('Progress = investable corpus ÷ target corpus today. Target = annual post-retirement expenses ÷ safe withdrawal rate. See FIRE screen for every step.')}</h3><div class="bar"><i style="width:${Math.min(100,inv/tg*100)}%"></i></div><div class="m">${fmt(inv)} of ${fmt(tg)} (today's money). ${y===null?'Not reachable in 60 years at these inputs.':'About '+y+' years to go.'}</div><div class="m">Assumes ${A.inf}% inflation, ${A.swr}% withdrawal, ${fmt(A.sip)}/month invested, ${pc(blend())} blended net return.</div></div>
<div class="c"><h3>Liquidity ${Q('Months covered = (bank + FD) ÷ monthly expenses. Expenses input: '+fmt(A.exp))}</h3><div class="big">${(liq/A.exp).toFixed(1)} months</div><div class="m">${fmt(liq)} against ${fmt(A.exp)}/month expenses (User input)</div></div></div>`}
function hold(){const rows=hs().filter(h=>h.c===S.ht);
return`<h2>Holdings</h2><button class="p" onclick="qu()" style="margin-bottom:12px">Quick monthly update</button> <button onclick="AH()" style="margin:0 0 12px 8px">Add holding to ${S.ht}</button><div class="tabs">${CL.map(c=>`<button class="${c===S.ht?'on':''}" onclick="S.ht='${c}';go()">${c==='PF'?'PF (EPF, PPF)':c}</button>`).join('')}</div>
${rows.length?`<div class="c tw"><table><tr><th>Name</th><th>Owner</th><th>Value (typed by you)</th><th>Invested</th><th>Gain/loss</th><th>Updated</th><th></th></tr>${rows.map(h=>`<tr><td>${IN('H',h.id,'n',h.n,0,170)}</td><td>${OS('H',h.id,h.o)}</td><td>${IN('H',h.id,'v',h.v,1)}</td><td>${IN('H',h.id,'inv',h.inv,1)}</td><td class="${h.v>=h.inv?'up':'dn'}">${fmt(h.v-h.inv)} (${pc((h.v-h.inv)/h.inv*100)})</td><td>30 Sep 2026</td><td><button onclick="D('H',${h.id})">Delete</button></td></tr>`).join('')}</table></div>`:empty()}
<p class="m">Every value is typed by you. Nothing is live. FD maturity value = principal × (1 + rate ÷ 4)^(4 × years), quarterly compounding (Estimate).</p>`}
function qu(){$('#dlg').innerHTML=`<h3>Monthly update: Sep 2026</h3><p class="m">Previous values prefilled. Edit only what changed.</p><button onclick="document.querySelectorAll('#dlg input').forEach(i=>i.value=i.dataset.p);tot()">Same as last month for all</button><div style="max-height:50vh;overflow:auto;margin:10px 0"><table>${hs().map(h=>`<tr><td>${h.n}<div class="m">${h.o}</div></td><td><input data-id="${h.id}" data-p="${h.v}" value="${h.v}" type="number" oninput="tot()" style="width:130px"></td></tr>`).join('')}</table></div><b>Total: <span id="tt"></span></b> <button class="p" onclick="sv()">Save snapshot</button> <button onclick="$('#dlg').close()">Cancel</button>`;$('#dlg').showModal();tot()}
const tot=()=>$('#tt').textContent=fmt(sum([...document.querySelectorAll('#dlg input')],i=>+i.value));
function sv(){document.querySelectorAll('#dlg input').forEach(i=>H.find(h=>h.id==i.dataset.id).v=+i.value);save();$('#dlg').close();toast('Snapshot saved');go()}
function liab_(){const L2=ls();if(!L2.length)return'<h2>Liabilities</h2>'+empty()+'<p><button onclick="AL()">Add loan or card</button></p>';const emi=sum(L2,l=>l.emi),x=S.pre,big=L2.find(l=>l.n==='Home loan')||L2.find(l=>l.emi);
let sim='';if(big&&big.emi){const n0=nper(big.bal,big.r,big.emi),n1=nper(big.bal,big.r,big.emi+x);sim=`<p>${big.n}: <b>${Math.round(n0-n1)} months saved</b>, <b>${fmt(big.emi*n0-(big.emi+x)*n1)} interest saved</b>.</p><p class="m">Assumes fixed ${big.r}% rate, EMI paid monthly, extra amount paid every month from now. Months = −ln(1 − balance × r ÷ EMI) ÷ ln(1 + r), r = rate ÷ 12.</p>`}
return`<h2>Liabilities</h2><div class="g"><div class="c"><div class="m">Total outstanding</div><div class="big">${fmt(liab())}</div></div><div class="c"><div class="m">Monthly EMI ${Q('Sum of EMIs of selected profile.')}</div><div class="big">${fmt(emi)}</div><div class="m">${pc(emi/A.income*100)} of monthly income <input type="number" value="${A.income}" onchange="A.income=+this.value;save();go()" style="width:110px"> (User input)</div></div></div>
<div class="c tw"><table><tr><th>Loan</th><th>Lender</th><th>Owner</th><th>Outstanding</th><th>Rate</th><th>EMI</th><th>Left</th><th>Next due</th><th>Debt-free</th><th></th></tr>${L2.map(l=>{const n=nper(l.bal,l.r,l.emi);return`<tr><td>${IN('L',l.id,'n',l.n,0,120)}</td><td>${IN('L',l.id,'l',l.l,0,110)}</td><td>${OS('L',l.id,l.o)}</td><td>${IN('L',l.id,'bal',l.bal,1)}</td><td>${IN('L',l.id,'r',l.r,1,70)}</td><td>${IN('L',l.id,'emi',l.emi,1,90)}</td><td>${l.emi?Math.ceil(n)+' mo':'-'}</td><td>${IN('L',l.id,'due',l.due,0,110)}</td><td>${l.emi?new Date(2026,8+Math.ceil(n)).toLocaleDateString('en-GB',{month:'short',year:'numeric'}):'Pay in full'}</td><td><button onclick="D('L',${l.id})">Delete</button></td></tr>`}).join('')}</table></div>
<p><button onclick="AL()">Add loan or card</button></p><div class="c"><h3>Prepayment simulator</h3><label class="m">Extra per month (₹) <input type="number" value="${x}" onchange="S.pre=+this.value;go()"></label>${sim}</div>`}
function fire(){if(!hs().length)return'<h2>FIRE calculators</h2>'+empty();const v=S.fire,b=blend(),rr=((1+b/100)/(1+A.inf/100)-1)*100,inv=sum(hs(),h=>h.v),ratio={Lean:60,Regular:80,Fat:120,Coast:80,Barista:80}[v],n=A.ret-A.ageS,f=Math.pow(1+A.inf/100,n),tg=target(v,n),y=years(v);
const F=(k,l,t)=>`<label>${l} <span class="tag ${t?'':'est'}">${t||'Estimate'}</span><input type="number" step="0.1" value="${A[k]}" onchange="A.${k}=+this.value;save();go()"></label>`;
const G=(o,k,l)=>`<label>${l} <span class="tag est">Estimate</span><input type="number" step="0.05" value="${o[k]}" onchange="${o===RET?'RET':'TAX'}['${k}']=+this.value;save();go()"></label>`;
const steps=`<ol><li>Monthly expenses today: ${fmt(A.exp)}</li><li>Post-retirement ratio (${v}): ${ratio}% → ${fmt(A.exp*ratio/100)}/month${v==='Barista'?', less part-time income '+fmt(A.part)+' = '+fmt(Math.max(0,A.exp*ratio/100-A.part))+'/month':''}</li><li>Annual: ×12</li><li>Inflated ${n} years at ${A.inf}% (×${f.toFixed(2)}) to retirement at age ${A.ret}</li><li>Divide by safe withdrawal rate ${A.swr}% → target corpus <b>${fmt(v==='Coast'?tg:tg)}</b> at retirement</li>${v==='Coast'?`<li>Coast number today = target ÷ (1 + ${b.toFixed(1)}%)^${n} = <b>${fmt(tg/Math.pow(1+b/100,n))}</b>. You have ${fmt(inv)}: ${inv>=tg/Math.pow(1+b/100,n)?'you have reached Coast':'not yet'}.</li>`:''}</ol>`;
const sens=[3,3.5,4].map(w=>`<tr><td>${w}%</td>${[5,6,7].map(i=>{const s=[A.swr,A.inf];A.swr=w;A.inf=i;const r=years(v);[A.swr,A.inf]=s;return`<td>${r===null?'60+':r+' yr'}</td>`}).join('')}</tr>`).join('');
return`<h2>FIRE calculators</h2><div class="c"><h3>Assumptions (all editable)</h3><div class="af">
${F('ageS','Age, Subh','User input')}${F('ageW','Age, Wife','User input')}${F('life','Life expectancy','User input')}${F('income','Monthly income (₹)','User input')}${F('ret','Target retirement age')}${F('exp','Monthly expenses (₹)')}${F('inf','General inflation %')}${F('hinf','Healthcare inflation %')}${F('swr','Safe withdrawal rate %')}${F('ratio','Post-retirement expense ratio % (Regular)')}${F('sip','Monthly investment (₹)')}${F('part','Barista part-time income (₹/mo)')}</div>
<h3 style="margin-top:12px">Expected nominal return % by class</h3><div class="af">${CL.map(c=>G(RET,c,c)).join('')}</div><h3 style="margin-top:12px">Tax drag % by class</h3><div class="af">${CL.map(c=>G(TAX,c,c)).join('')}</div><p class="m">PF is one class: enter a blend of EPF 8.25% and PPF 7.1%, and verify both against current notifications. Wife's age and life expectancy are recorded but not yet used in the calculations.</p>
<div class="note warn">The US 4% rule assumes lower inflation. 3.5% is a more cautious Indian default.</div>
<p>Blended net return <b>${pc(b)}</b> ${Q('Blended = Σ(value × (return − tax drag)) ÷ total value, using your current holdings.')} Real return = (1 + ${b.toFixed(2)}%) ÷ (1 + ${A.inf}%) − 1 = <b>${pc(rr)}</b></p></div>
<div class="tabs" style="margin-top:14px">${['Lean','Regular','Fat','Coast','Barista'].map(x=>`<button class="${x===v?'on':''}" onclick="S.fire='${x}';go()">${x}</button>`).join('')}</div>
<div class="g"><div class="c"><h3>${v}</h3><div class="m">${{Lean:'Basic living costs only, 60% of today’s spend.',Regular:'Current lifestyle, 80% of today’s spend.',Fat:'Upgraded lifestyle, 120% of today’s spend.',Coast:'Corpus today that grows to the Regular target with no further saving.',Barista:'Part-time income covers part of expenses; corpus covers the rest.'}[v]}</div>${steps}<div class="big">${y===null?'60+ years':y+' years'}</div><div class="${y!==null&&A.ageS+y<=A.ret?'up':'dn'}">${y!==null&&A.ageS+y<=A.ret?'On track':'Off track'} for age ${A.ret}. FIRE age ${y===null?'-':A.ageS+y}.</div></div>

function bak(){return`<h2>Backup settings</h2><div class="note">Your data is stored on this device only. FinWin has no server.</div><div class="g" style="margin-top:14px"><div class="c"><h3>Export</h3><button class="p" onclick="dl('finwin-backup.json',JSON.stringify({H,L,A,RET,TAX}))">Export JSON (full backup)</button> <button onclick="dl('holdings.csv',['class,name,owner,value,invested',...H.map(h=>[h.c,h.n,h.o,h.v,h.inv].join())].join('\\n'))">Export CSV (holdings)</button>
<p><label><input type="checkbox" onchange="toast(this.checked?'Encryption on (prototype)':'Encryption off')"> Password-encrypt backup</label></p><p class="m">If you lose the password, the file cannot be recovered.</p></div>
<div class="c"><h3>Import</h3><input type="file" accept=".json" onchange="imp(this.files[0])"><p class="m">A preview shows what will be added or overwritten before you confirm.</p></div></div>
<div class="c"><p>Last backed up: ${S.backup} days ago. Reminder after <input type="number" value="${A.rem}" onchange="A.rem=+this.value;save();go()" style="width:70px"> days.</p><p class="m">Backup history: keeps the last export date only.</p><div class="note warn">Clearing the browser cache or changing device can erase your data. Keep a copy in two places.</div><p><button onclick="if(confirm('Delete all data?')&&confirm('This cannot be undone. Continue?')){H=[];L=[];save();$('#demo').checked=false;go()}">Reset all data</button></p></div>`}
function dl(n,t){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t]));a.download=n;a.click();S.backup=0;save();toast('Backup exported');}
const V={dash,hold,liab:liab_,fire,bak};
function go(){$('#nav').innerHTML=T.map(t=>`<button class="${t[0]===S.tab?'on':''}" onclick="S.tab='${t[0]}';go()">${t[1]}</button>`).join('');$('#main').innerHTML=V[S.tab]()}
$('#prof').onchange=$('#demo').onchange=go;$('#th').onclick=()=>{const r=document.documentElement,d=r.dataset.theme==='dark'||(!r.dataset.theme&&matchMedia('(prefers-color-scheme:dark)').matches);r.dataset.theme=d?'light':'dark'};go();
